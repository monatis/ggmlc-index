name: delete

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: 'Package name to delete (e.g. ggmlc)'
        required: true
        type: string
      version:
        description: 'Specific version/tag to delete (optional; leaves other versions intact, or delete entire package if empty)'
        required: false
        type: string

jobs:
  delete:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install beautifulsoup4

    - name: Delete Package / Version from Index
      env:
        PKG_ACTION: DELETE
        PKG_NAME: ${{ inputs.package_name }}
        PKG_TAG: ${{ inputs.version }}
      run: |
        python .github/actions.py

    - name: Create Pull Request
      uses: peter-evans/create-pull-request@v7
      with:
        commit-message: ':package: [:robot:] Delete ${{ inputs.package_name }} ${{ inputs.version }} from PyPi index'
        title: '[🤖] Delete `${{ inputs.package_name }}` ${{ inputs.version }} from PyPi index'
        body: Automatically generated PR deleting `${{ inputs.package_name }}` ${{ inputs.version }} from PyPi index.
        branch-suffix: random
        delete-branch: true
