name: update

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: 'Package name (e.g. ggmlc)'
        required: true
        type: string
      tag:
        description: 'Release tag to update (e.g. v0.1.2 or "all" to sync all releases)'
        required: false
        default: 'all'
        type: string
      repository:
        description: 'GitHub Repository (optional, e.g. monatis/ggmlc if not already indexed)'
        required: false
        type: string

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install beautifulsoup4

    - name: Update Package in PyPi Index
      env:
        PKG_ACTION: UPDATE
        PKG_NAME: ${{ inputs.package_name }}
        PKG_TAG: ${{ inputs.tag }}
        PKG_REPO: ${{ inputs.repository }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        python .github/actions.py

    - name: Create Pull Request
      uses: peter-evans/create-pull-request@v7
      with:
        commit-message: ':package: [:robot:] Update package ${{ inputs.package_name }} in PyPi index'
        title: '[🤖] Update `${{ inputs.package_name }}` in PyPi index'
        body: Automatically generated PR updating `${{ inputs.package_name }}` pre-built release wheels in PyPi index.
        branch-suffix: random
        delete-branch: true
